# Kiểm tra tự động mỗi lần push hoặc mở Pull Request: định dạng, lint, test.
# Chạy trên Windows vì Desktop dùng pywin32. Quy tắc: docs/quy-uoc/quy-tac-code.md
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            **/pyproject.toml
      - name: Cài môi trường
        run: python -m pip install -r requirements-dev.txt
      - name: Kiểm tra định dạng (ruff format)
        run: ruff format --check .
      - name: Kiểm tra quy tắc code (ruff check)
        run: ruff check .
      - name: Chạy test (pytest)
        run: pytest

  # Backend trên PostgreSQL thật (khi triển khai dùng PostgreSQL, máy phát triển dùng SQLite).
  # Service container chỉ có trên Linux, nên job này chạy Ubuntu và không cài Desktop (pywin32).
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tutor
          POSTGRES_PASSWORD: tutor
          POSTGRES_DB: tutor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tutor -d tutor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TUTOR_TEST_DATABASE_URL: postgresql+psycopg://tutor:tutor@localhost:5432/tutor_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            **/pyproject.toml
      - name: Cài excel_core và Backend
        run: python -m pip install -e packages/excel_core -e apps/backend pytest==9.2.0 openapi-spec-validator==0.7.2
      - name: Migration và test Backend trên PostgreSQL 16
        run: pytest apps/backend

  # Web quản trị (React + TypeScript): kiểu API khớp đặc tả, định dạng, lint, kiểu, test, build.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Cài gói
        run: npm ci
      - name: Kiểu API khớp openapi.yaml
        run: npm run check:api
      - name: Kiểm tra định dạng (Prettier)
        run: npm run format:check
      - name: Kiểm tra quy tắc code (ESLint)
        run: npm run lint
      - name: Chạy test (Vitest)
        run: npm test
      - name: Kiểm kiểu và build
        run: npm run build
