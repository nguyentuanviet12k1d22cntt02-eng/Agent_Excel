# Cấu hình Alembic (migration CSDL, T5.1). URL CSDL lấy từ Settings (apps/backend/.env), không ghi ở đây.
#   .venv\Scripts\python -m tutor_backend migrate        (nâng lên bản mới nhất)
#   .venv\Scripts\alembic -c apps\backend\alembic.ini revision --autogenerate -m "<mo ta khong dau>"
# Tên file migration phải ASCII (quy tắc đặt tên) nên mô tả viết không dấu; rà lại file sinh ra.
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
