[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tutor-backend"
version = "0.1.0"
description = "Backend FastAPI: học liệu, RAG, sinh kịch bản, tiến độ"
requires-python = ">=3.14"
# Ứng dụng: ghim cứng phiên bản (==). Thêm thư viện thì nêu lý do trong Pull Request.
# excel-core được cài dạng editable qua requirements-dev.txt ở gốc repo.
dependencies = [
    # Web API
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.33",
    "pydantic-settings==2.16.2",
    "httpx==0.28.1",
    # Cơ sở dữ liệu: PostgreSQL khi triển khai (psycopg 3), SQLite khi phát triển và test (T5.1)
    "SQLAlchemy==2.1.8",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.8",
    # Xác thực (T5.2): băm mật khẩu argon2, JWT
    "argon2-cffi==25.1.0",
    "PyJWT==2.15.1",
    # Đọc Excel, kiểm tra lược đồ kịch bản
    "openpyxl==3.1.5",
    "jsonschema==4.26.0",
    # Đọc giáo trình cho RAG (T5.4). Không dùng PyMuPDF vì giấy phép AGPL
    "pypdf==7.0.0",
    "python-docx==1.2.0",
    # Chưa chốt, thêm ở task tương ứng:
    #   embedding + lưu vector ........... chờ chọn nhà cung cấp (Q10 gửi GVHD; kien-truc.md A7)
]

# Prompt LLM là file .md nằm trong package (ai/prompts/): phải đóng gói kèm khi cài không ở chế độ editable
[tool.setuptools.package-data]
tutor_backend = ["ai/prompts/*.md"]
