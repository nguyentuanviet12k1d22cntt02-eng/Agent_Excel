# Cấu hình ruff dùng chung cho mọi phần Python. Quy tắc: docs/quy-uoc/quy-tac-code.md
target-version = "py314"
line-length = 110
extend-exclude = ["nckh", "Cơ bản", "samples/_local"]

[lint]
# E/W/F: lỗi cơ bản · I: sắp xếp import · N: đặt tên PEP 8 · B: lỗi hay gặp
# UP: cú pháp Python mới · SIM: đơn giản hóa · PTH: dùng pathlib · T20: cấm print · BLE: cấm bắt Exception chung
select = ["E", "W", "F", "I", "N", "B", "UP", "SIM", "PTH", "T20", "BLE"]

[lint.isort]
known-first-party = ["excel_core", "tutor_backend", "tutor_desktop"]

[lint.per-file-ignores]
# Spike, script tiện ích, điểm khởi động: được dùng print
"spikes/**" = ["T20", "BLE001", "PTH", "E501"]
"scripts/**" = ["T20"]
"**/__main__.py" = ["T20"]
# Test: được dùng assert và tên tự do
"**/tests/**" = ["N802"]
